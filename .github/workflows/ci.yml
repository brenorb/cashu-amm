name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.12"
      - run: npm ci
      - run: uv sync --no-config --locked --dev
      - run: uv run --no-config --locked ruff check .
      - run: npm test
      - run: uv run --no-config --locked pytest
